name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build server
        run: go build ./cmd/server

      - name: Run unit tests
        run: go test -v -short ./internal/...

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: server-dev-deploy
      cancel-in-progress: false
    environment: development
    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail

          for required in VPS_HOST VPS_USER VPS_SSH_KEY VPS_SSH_HOST_KEY VPS_APP_DIR; do
            if [ -z "${!required}" ]; then
              echo "Required secret $required is not configured."
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -T 10 -p "$VPS_PORT" "$VPS_HOST" >/dev/null

          app_dir_b64="$(printf '%s' "$VPS_APP_DIR" | base64 -w 0)"
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=3 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$app_dir_b64" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$(printf '%s' "$1" | base64 --decode)"
          cd "$APP_DIR"

          git fetch origin dev
          git checkout dev
          git pull --ff-only origin dev

          if docker compose version >/dev/null 2>&1; then
            compose_cmd=(docker compose)
          elif command -v docker-compose >/dev/null 2>&1; then
            compose_cmd=(docker-compose)
          else
            echo "Docker Compose is not available on the VPS."
            exit 1
          fi

          "${compose_cmd[@]}" up -d --build

          for attempt in {1..30}; do
            if "${compose_cmd[@]}" exec -T server curl --fail --silent --show-error --max-time 5 http://localhost:8080/health >/dev/null; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying..."
            sleep 2
          done

          echo "Health check failed after restart."
          "${compose_cmd[@]}" ps
          "${compose_cmd[@]}" logs --tail=100
          exit 1
          REMOTE
