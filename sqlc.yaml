version: "2"
sql:
  - engine: postgresql
    schema: internal/db/schema.sql
    queries: internal/db/queries
    gen:
      go:
        package: dbsqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - column: services.service_id
            go_type: int64
          - column: bookings.booking_id
            go_type: int64
          - column: bookings.client_id
            go_type:
              type: int64
              pointer: true
          - column: bookings.service_id
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
