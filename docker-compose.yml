services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relaxation-hub-server
    restart: unless-stopped
    environment:
      # Supabase PostgreSQL connection (uses external Supabase database)
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-8080}
      JWT_KEY: ${JWT_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID}
      APPLE_OAUTH_CLIENT_SECRET: ${APPLE_OAUTH_CLIENT_SECRET}
      APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID}
      APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID}
      APPLE_OAUTH_CALLBACK_URL: ${APPLE_OAUTH_CALLBACK_URL}
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - relaxation-hub-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/v1/services",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  relaxation-hub-network:
    driver: bridge
