services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relaxation-hub-server
    env_file:
      - .env
    environment:
      DB_MAX_CONNS: "10"
      DB_MIN_CONNS: "5"
      DB_MAX_CONN_IDLE_TIME: "30m"
      DB_MAX_CONN_LIFETIME_JITTER: "5m"
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --silent --show-error --max-time 5 http://localhost:8080/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app

networks:
  app:
    driver: bridge
